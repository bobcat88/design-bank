<title>404 · Tact</title>
<link rel="stylesheet" href="/shared/bank.css">
<style>
  body { background: #090a0d; color: #f2f3f5; }
  main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px; text-align: center; }
  .box { max-width: 520px; display: grid; gap: 16px; justify-items: center; }
  h1 { font-size: clamp(44px, 7vw, 72px); line-height: 1; margin: 0; font-family: var(--font); font-weight: 500; letter-spacing: -.03em; }
  p { margin: 0; color: #9ca3af; font-size: 16px; line-height: 1.5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  a { padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); color: #f2f3f5; text-decoration: none; font-size: 14px; font-weight: 500; transition: background-color .18s var(--ease-out), border-color .18s var(--ease-out), transform .14s var(--ease-out); }
  a.primary { background: #f4f2ec; color: #090a0d; border-color: #f4f2ec; font-weight: 600; }
  a:hover { background: #181b22; border-color: rgba(255,255,255,.32); }
  a.primary:hover { background: #ffffff; }
  a:active { transform: translateY(1px); }
</style>
</head>
