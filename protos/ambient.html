<!doctype html>
<html lang="fr" data-palette="forest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fonds ambiants</title>
<link rel="stylesheet" href="../shared/bank.css">
<style>
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
  .card { max-width: 560px; padding: 40px; border-radius: 32px; background: color-mix(in srgb, var(--bg) 82%, transparent); border: 1px solid var(--line); }
  h1 { font-size: clamp(34px, 4vw, 56px); line-height: 1.05; }
  .card p { color: var(--muted); font-size: 18px; line-height: 1.55; margin: 16px 0 0; }
  .spacer { height: 140vh; }
  html.embed main { display: none; } html.embed .spacer { display: none; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main><div class="card">
  <h1>Un fond qui vit, un texte qui reste lisible.</h1>
  <p>Particules, blobs, polygones ou tuiles. La carte posée dessus vérifie que le contenu garde le dessus.</p>
</div></main>
<div class="spacer"></div>
<script src="../shared/bank.js"></script>
<script>
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  let W, H, items = [];
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  var cfg = Bank.panel({
    title: "Fonds ambiants", values: { palette: "forest", mode: "loop" },
    selects: [{ key: "kind", label: "Fond", value: "particles", options: [["particles", "Particules"], ["blobs", "Blobs"], ["polys", "Polygones"], ["tiles", "Tuiles"]] },
              { key: "mode", label: "Animation", value: "loop", options: [["loop", "Boucle"], ["scroll", "Parallaxe au scroll"]] }],
    sliders: [{ key: "density", label: "Densité", min: 4, max: 80, value: 30 }, { key: "speed", label: "Vitesse", min: 0, max: 30, value: 10 }, { key: "blur", label: "Flou", min: 0, max: 40, value: 6 }],
    onChange: (c, k) => { if (k !== "speed" && k !== "mode" && W) seed(); },
  });
  function size() { const d = document.documentElement.classList.contains("embed") ? 1 : Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  function seed() {
    const n = cfg.kind === "blobs" ? Math.max(3, cfg.density / 8 | 0) : cfg.density;
    const cols = ["--tile", "--l1", "--l2", "--l3", "--active"].map(css);
    items = [...Array(n)].map((_, i) => ({ x: Math.random() * W, y: Math.random() * H, z: .3 + Math.random() * .7, r: cfg.kind === "blobs" ? 120 + Math.random() * 160 : 4 + Math.random() * 26,
      a: Math.random() * 6.28, va: (Math.random() - .5) * .02, vx: (Math.random() - .5), vy: (Math.random() - .5), sides: 3 + (i % 4), c: cols[i % cols.length], ph: Math.random() * 6.28 }));
  }
  function poly(x, y, r, s, a) { ctx.beginPath(); for (let i = 0; i < s; i++) { const t = a + i / s * 6.283; ctx[i ? "lineTo" : "moveTo"](x + Math.cos(t) * r, y + Math.sin(t) * r); } ctx.closePath(); }
  let last = 0, clock = 0;
  (function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (document.hidden) return;
    // per-second speed, so a 144 Hz screen is not faster than 60 Hz; sp=1 → 12 px/s
    const red = Bank.reduced(), sp = red ? 0 : cfg.speed / 10, f = dt * 12, par = cfg.mode === "scroll" ? scrollY : 0;
    clock += dt * sp * .25; const t = clock;
    // blur on the canvas element (GPU), not ctx.filter, which re-blurs on the CPU every frame
    cv.style.filter = cfg.blur ? `blur(${cfg.kind === "blobs" ? cfg.blur * 2 : cfg.blur / 4}px)` : "";
    ctx.clearRect(0, 0, W, H);
    if (cfg.kind === "tiles") {   // grid of shapes that turn one after another
      const s = Math.max(40, 260 - cfg.density * 2.6), cols = Math.ceil(W / s) + 1;
      for (let gy = 0; gy * s < H + s; gy++) for (let gx = 0; gx < cols; gx++) {
        const k = gx + gy * cols, it = items[k % items.length], turn = (Math.sin(t * 3 - (gx + gy) * .35) + 1) / 2;
        ctx.fillStyle = it.c; ctx.globalAlpha = .18 + turn * .5;
        const x = gx * s + s / 2, y = gy * s + s / 2 - (par * .3) % s;
        if (k % 3 === 0) { ctx.beginPath(); ctx.arc(x, y, s * .3 * (.6 + turn * .4), 0, 6.283); } else poly(x, y, s * .34, k % 3 === 1 ? 4 : 3, turn * Math.PI);
        ctx.fill();
      }
    } else items.forEach((it) => {
      it.x = (it.x + it.vx * sp * it.z * f + W + 200) % (W + 400) - 200; it.y = (it.y + it.vy * sp * it.z * f + H + 200) % (H + 400) - 200; it.a += it.va * sp * f;
      const y = it.y - par * it.z * .6; ctx.fillStyle = it.c;
      if (cfg.kind === "particles") { ctx.globalAlpha = .25 + it.z * .5; ctx.beginPath(); ctx.arc(it.x, y, it.r * it.z, 0, 6.283); ctx.fill(); }
      else if (cfg.kind === "polys") { ctx.globalAlpha = .35; poly(it.x, y, it.r * 2.4, it.sides, it.a); ctx.fill(); }
      else { ctx.globalAlpha = .55; ctx.beginPath();           // blob: wobbling circle
        for (let i = 0; i <= 24; i++) { const a = i / 24 * 6.283, r = it.r * (1 + .12 * Math.sin(a * 3 + t * 4 + it.ph)); ctx[i ? "lineTo" : "moveTo"](it.x + Math.cos(a) * r, y + Math.sin(a) * r); }
        ctx.fill(); }
    });
    ctx.globalAlpha = 1;
  })(0);
  addEventListener("resize", () => { size(); seed(); });
  size(); seed();
</script>
</body>
</html>
