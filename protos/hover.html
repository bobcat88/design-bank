<!doctype html>
<html lang="fr" data-palette="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactions au curseur</title>
<link rel="stylesheet" href="../shared/bank.css">
<style>
  main { max-width: 1240px; margin: 0 auto; padding: 56px 40px 120px; }
  h1 { font-size: clamp(36px, 4.4vw, 64px); line-height: 1.05; max-width: 18ch; }
  .lead { color: var(--muted); font-size: 18px; margin: 16px 0 40px; max-width: 52ch; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cell { position: relative; min-height: 340px; border-radius: 24px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .cell > small { position: absolute; left: 20px; top: 16px; color: var(--muted); font-size: 13px; }
  /* magnetic */
  .mag { padding: 20px 40px; border-radius: 999px; border: 0; background: var(--tile); color: var(--tile-ink); font-size: 18px; font-weight: 600; will-change: transform; }
  .mag span { display: inline-block; will-change: transform; }
  /* spotlight */
  .spots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 86%; }
  .spot { position: relative; height: 110px; border-radius: 16px; background: color-mix(in srgb, var(--bg) 70%, var(--panel)); }
  .spot::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: radial-gradient(var(--sz, 220px) circle at var(--x, -999px) var(--y, -999px), var(--tile), transparent 60%), var(--line);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .spot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(var(--sz, 220px) circle at var(--x, -999px) var(--y, -999px), color-mix(in srgb, var(--tile) 12%, transparent), transparent 60%); }
  /* tilt */
  .stage { perspective: 900px; }
  .tilt { position: relative; width: 300px; height: 200px; border-radius: 20px; background: linear-gradient(135deg, var(--tile), color-mix(in srgb, var(--tile) 40%, var(--l2))); transform-style: preserve-3d; will-change: transform; box-shadow: 0 30px 50px -20px rgba(0,0,0,.5); }
  .tilt b { position: absolute; left: 24px; bottom: 20px; color: var(--tile-ink); font-size: 22px; transform: translateZ(40px); }
  .tilt .glare { position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.45), transparent 55%); mix-blend-mode: overlay; }
  /* cursor follower */
  .links { display: flex; gap: 28px; font-size: 22px; } .links a { color: var(--fg, inherit); text-decoration: none; }
  #dot { position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--tile); pointer-events: none; z-index: 50; transition: width .25s var(--ease-out), height .25s var(--ease-out), margin .25s var(--ease-out), opacity .2s; mix-blend-mode: difference; }
  #dot.big { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
  html.embed main { padding: 3vh 3vw; } html.embed h1, html.embed .lead { display: none; } html.embed .cell { min-height: 46vh; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Ce qui réagit sous le curseur.</h1>
  <p class="lead">Bouton aimanté, bordure éclairée, carte inclinée et curseur qui suit. Au repos ou au tactile, tout reste à plat et lisible.</p>
  <div class="grid">
    <div class="cell" id="cMag"><small>Bouton aimanté</small><button class="mag" type="button"><span>Commencer</span></button></div>
    <div class="cell" id="cSpot"><small>Bordure éclairée</small><div class="spots"><div class="spot"></div><div class="spot"></div><div class="spot"></div><div class="spot"></div><div class="spot"></div><div class="spot"></div></div></div>
    <div class="cell stage" id="cTilt"><small>Carte inclinée</small><div class="tilt"><div class="glare"></div><b>Carte 3D</b></div></div>
    <div class="cell" id="cDot"><small>Curseur qui suit</small><nav class="links"><a href="#">Projets</a><a href="#">Studio</a><a href="#">Contact</a></nav></div>
  </div>
</main>
<div id="dot" aria-hidden="true"></div>
<script src="../shared/bank.js"></script>
<script>
  var cfg = Bank.panel({
    title: "Interactions au curseur", values: { palette: "ink" },
    sliders: [{ key: "mag", label: "Aimant", min: 0, max: 60, value: 30 }, { key: "tilt", label: "Inclinaison (°)", min: 0, max: 30, value: 14 }, { key: "sz", label: "Halo (px)", min: 80, max: 400, value: 220 }],
    toggles: [{ key: "dot", label: "Curseur personnalisé", value: true }],
  });
  const $ = (s) => document.querySelector(s), mag = $(".mag"), tilt = $(".tilt"), dot = $("#dot");
  const spots = [...document.querySelectorAll(".spot")], cTilt = $("#cTilt");
  const embed = document.documentElement.classList.contains("embed"), fine = matchMedia("(pointer: fine)").matches;
  let ptr = { x: -999, y: -999 }, dx = -999, dy = -999, real = false, rects = new Map(), dirty = true;
  const cells = ["#cMag", "#cSpot", "#cTilt", "#cDot"].map($);
  const tracked = [mag, cTilt, tilt, ...spots, ...cells];
  const measure = () => { rects.clear(); tracked.forEach((el) => rects.set(el, el.getBoundingClientRect())); dirty = false; };
  addEventListener("resize", () => { dirty = true; }, { passive: true });
  addEventListener("scroll", () => { dirty = true; }, { passive: true });
  addEventListener("pointermove", (e) => { real = true; ptr = { x: e.clientX, y: e.clientY }; });
  document.querySelectorAll(".links a, .mag").forEach((a) => { a.addEventListener("pointerenter", () => dot.classList.add("big")); a.addEventListener("pointerleave", () => dot.classList.remove("big")); });
  const local = (el) => { const r = rects.get(el); return { r, x: ptr.x - r.left, y: ptr.y - r.top, in: ptr.x > r.left && ptr.x < r.right && ptr.y > r.top && ptr.y < r.bottom }; };
  (function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    if (dirty) measure();
    const red = Bank.reduced();
    if (embed && !real && !red) { // thumbnail: a fake pointer visits each cell in turn
      const k = Math.floor(now / 2200) % 4, r = rects.get(cells[k]), t = now / 700;
      ptr = { x: r.left + r.width * (.5 + .28 * Math.cos(t)), y: r.top + r.height * (.5 + .28 * Math.sin(t * 1.3)) };
    }
    // magnetic: button and its label drift toward the pointer
    const m = local(mag), mx = m.x - m.r.width / 2, my = m.y - m.r.height / 2, near = Math.hypot(mx, my) < 160 && !red;
    const s = cfg.mag / 100;
    mag.style.transform = near ? `translate(${mx * s}px, ${my * s}px)` : ""; mag.firstChild.style.transform = near ? `translate(${mx * s * .4}px, ${my * s * .4}px)` : "";
    mag.style.transition = near ? "none" : "transform .5s var(--ease-out)";
    // spotlight: one pointer position, every card reads it in its own coordinates
    spots.forEach((c) => { const l = local(c); c.style.setProperty("--x", l.x + "px"); c.style.setProperty("--y", l.y + "px"); c.style.setProperty("--sz", cfg.sz + "px"); });
    // tilt + glare
    const tl = local(cTilt), tc = local(tilt);
    if (tl.in && !red) { const u = tc.x / tc.r.width - .5, v = tc.y / tc.r.height - .5;
      tilt.style.transform = `rotateX(${-v * cfg.tilt}deg) rotateY(${u * cfg.tilt}deg)`; tilt.style.setProperty("--gx", (u + .5) * 100 + "%"); tilt.style.setProperty("--gy", (v + .5) * 100 + "%"); tilt.style.transition = "none"; }
    else { tilt.style.transform = ""; tilt.style.transition = "transform .6s var(--ease-out)"; }
    // follower: eased toward the pointer
    const on = cfg.dot && (fine || embed) && !red; dot.style.opacity = on ? 1 : 0;
    dx += (ptr.x - dx) * .18; dy += (ptr.y - dy) * .18; dot.style.transform = `translate(${dx}px, ${dy}px)`;
  })(0);
</script>
</body>
</html>
