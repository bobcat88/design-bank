<!doctype html>
<html lang="fr" data-palette="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bandes défilantes</title>
<link rel="stylesheet" href="../shared/bank.css">
<style>
  body { overflow-x: hidden; }
  header { text-align: center; padding: 14vh 24px 8vh; }
  h1 { font-size: clamp(40px, 5.6vw, 84px); line-height: 1.02; max-width: 16ch; margin: 0 auto; }
  header p { color: var(--muted); font-size: 18px; margin: 20px auto 0; max-width: 46ch; line-height: 1.5; }
  .band { display: flex; gap: 16px; width: max-content; padding: 8px 0; will-change: transform; }
  .tile { width: 200px; aspect-ratio: 4/3; border-radius: var(--rad, 20px); background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; color: var(--tile); flex: none; }
  .tile svg { width: 64px; height: 64px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--ease-out), filter .3s; }
  .fx-pulse .tile:hover svg { animation: pulse .6s var(--ease-out); }
  .fx-jump .tile:hover svg { transform: translateY(-10px); }
  .fx-glow .tile:hover svg { filter: drop-shadow(0 0 10px currentColor); }
  .fx-wiggle .tile:hover svg { animation: wig .5s ease-in-out; }
  @keyframes pulse { 50% { transform: scale(1.2); } } @keyframes wig { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  .rows { padding-bottom: 20vh; overflow: hidden; }
  html.embed header { padding: 8vh 24px 5vh; } html.embed header p { display: none; }
</style>
</head>
<body>
<header>
  <h1>Toute la galerie, en mouvement.</h1>
  <p>Deux bandes de vignettes en sens opposé. Survole une vignette pour voir son icône réagir.</p>
</header>
<div class="rows" aria-hidden="true"><div class="band" id="r0"></div><div class="band" id="r1"></div></div>
<script src="../shared/bank.js"></script>
<script>
  const ICONS = [ // authored line icons, 24 grid
    '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',
    '<path d="M4 12h16M12 4v16"/><circle cx="12" cy="12" r="9"/>',
    '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12h0M8 16h2M12 16h2"/>',
    '<path d="M12 21s-7-5-7-11a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 6-7 11-7 11z"/>',
    '<path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/>',
    '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  ];
  const rows = [0, 1].map((k) => { const r = document.getElementById("r" + k);
    const set = ICONS.map((_, i) => ICONS[(i * 3 + k * 5) % ICONS.length]);
    r.innerHTML = [...set, ...set, ...set].map((d) => `<div class="tile"><svg viewBox="0 0 24 24">${d}</svg></div>`).join(""); return r; });
  var cfg = Bank.panel({
    title: "Bandes défilantes", values: { palette: "ink", mode: "loop" },
    selects: [{ key: "mode", label: "Animation", value: "loop", options: [["loop", "Défilement continu"], ["scroll", "Lié au scroll"]] },
              { key: "fx", label: "Survol", value: "jump", options: [["pulse", "Pulsation"], ["jump", "Saut"], ["glow", "Halo"], ["wiggle", "Secousse"]] }],
    sliders: [{ key: "speed", label: "Vitesse", min: 5, max: 120, value: 40 }, { key: "rad", label: "Arrondi", min: 0, max: 60, value: 20 }],
    toggles: [{ key: "pause", label: "Pause au survol", value: true }],
    onChange: (c) => { document.body.className = "fx-" + c.fx; document.body.style.setProperty("--rad", c.rad + "px"); },
  });
  let off = 0, hover = false, last = performance.now();
  document.querySelector(".rows").addEventListener("pointerenter", () => hover = true);
  document.querySelector(".rows").addEventListener("pointerleave", () => hover = false);
  (function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!Bank.reduced() && !(cfg.pause && hover)) off += cfg.speed * dt;
    const pos = cfg.mode === "scroll" ? scrollY * .8 : off;
    rows.forEach((r, k) => { const w = r.scrollWidth / 3, x = pos % w; r.style.transform = `translateX(${k ? x - w : -x}px)`; });
  })(last);
</script>
</body>
</html>
