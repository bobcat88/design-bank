<!doctype html>
<html lang="fr" data-palette="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stepper orbital</title>
<link rel="stylesheet" href="../shared/bank.css">
<style>
  #track { position: relative; }
  main { position: sticky; top: 0; max-width: 1240px; margin: 0 auto; padding: 56px 32px 120px; display: grid; grid-template-columns: 1fr minmax(320px, 440px); gap: 48px; align-items: center; min-height: 100vh; }
  #orbit { position: relative; width: min(100%, 620px); aspect-ratio: 1; margin: 0 auto; }
  .ring { position: absolute; left: 50%; top: 50%; border: 1px solid var(--line); border-radius: 50%; translate: -50% -50%; }
  .ring:nth-child(1) { width: 36%; height: 36%; }
  .ring:nth-child(2) { width: 64%; height: 64%; }
  .ring:nth-child(3) { width: 92%; height: 92%; }
  .core { position: absolute; left: 50%; top: 50%; width: 16%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--tile); opacity: .9; }
  .pill { position: absolute; translate: -50% -50%; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 15px; white-space: nowrap; transition: background .4s var(--ease-out), color .4s var(--ease-out), border-color .4s, transform .6s var(--ease-out); }
  .pill:hover { color: var(--text); }
  .pill.is-active { background: var(--tile); color: var(--tile-ink); border-color: transparent; transform: scale(1.08); }
  .num { font: 600 12px var(--mono); letter-spacing: .1em; color: var(--tile); }
  #info h2 { font-size: clamp(32px, 3.4vw, 52px); line-height: 1.06; margin: 14px 0 16px; }
  #info p { color: var(--muted); font-size: 18px; line-height: 1.55; margin: 0; }
  #info > div { transition: opacity .35s ease, transform .5s var(--ease-out); }
  #info.swap > div { opacity: 0; transform: translateY(10px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="track"><main>
  <div id="orbit" role="tablist" aria-label="Étapes">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="core"></div>
  </div>
  <section id="info" aria-live="polite"><div>
    <div class="num"></div><h2></h2><p></p>
  </div></section>
</main></div>
<script src="../shared/bank.js"></script>
<script>
  const STEPS = [
    { t: 'Capturer',    d: 'Chaque idée, mail ou note entre en une seconde, sans classement à faire.' },
    { t: 'Qualifier',   d: 'Le contexte est ajouté tout seul : qui, quoi, pour quand.' },
    { t: 'Synthétiser', d: 'Les éléments proches sont regroupés en une vue lisible.' },
    { t: 'Valider',     d: 'Tu confirmes ou corriges. Rien ne part sans ton accord.' },
    { t: 'Itérer',      d: 'Chaque correction rend le cycle suivant plus juste.' },
  ];
  const orbit = document.getElementById('orbit'), info = document.getElementById('info');
  const rings = [...orbit.querySelectorAll('.ring')];
  const pills = STEPS.map((s, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pill'; b.setAttribute('role', 'tab'); b.textContent = s.t;
    const a = (-90 + i * (360 / STEPS.length)) * Math.PI / 180;
    b.style.left = 50 + 46 * Math.cos(a) + '%'; b.style.top = 50 + 46 * Math.sin(a) + '%';
    b.addEventListener('click', () => { pinned = true; go(i); });
    orbit.appendChild(b); return b;
  });
  const [num, h2, p] = [info.querySelector('.num'), info.querySelector('h2'), info.querySelector('p')];
  let cur = -1;
  function go(i) {
    if (i === cur) return; cur = i;
    pills.forEach((b, k) => { b.classList.toggle('is-active', k === i); b.setAttribute('aria-selected', k === i); b.tabIndex = k === i ? 0 : -1; });
    // rings restart from small, fast start, slow finish
    if (!Bank.reduced()) rings.forEach((r, k) => r.animate([{ scale: .4, opacity: .2 }, { scale: 1, opacity: 1 }], { duration: cfg.dur, delay: k * 70, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
    info.classList.add('swap');
    setTimeout(() => { num.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(STEPS.length).padStart(2, '0'); h2.textContent = STEPS[i].t; p.textContent = STEPS[i].d; info.classList.remove('swap'); }, Bank.reduced() ? 0 : 180);
  }
  orbit.addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
    if (d) { pinned = true; const n = (cur + d + STEPS.length) % STEPS.length; go(n); pills[n].focus(); }
  });
  let pinned = false;
  var cfg = Bank.panel({
    title: "Stepper orbital", values: { palette: "ink", mode: "loop" },
    selects: [{ key: "mode", label: "Animation", value: "loop", options: [["loop", "Boucle"], ["once", "Une fois"], ["scroll", "Au scroll"]] }],
    sliders: [{ key: "dur", label: "Durée anneaux", min: 300, max: 2000, step: 50, value: 1000 }],
    onChange: (c, k) => { cfg = c; if (k === "mode") { pinned = false; track.style.height = c.mode === "scroll" ? "400vh" : "100vh"; } },
  });
  const track = document.getElementById("track"); track.style.height = cfg.mode === "scroll" ? "400vh" : "100vh";
  const N = STEPS.length;
  go(0);
  Bank.drive({
    el: track, mode: () => cfg.mode, dur: () => N * 4000, hold: 0,
    scroll: () => { const r = track.getBoundingClientRect(); return Bank.clamp01(-r.top / Math.max(1, r.height - innerHeight)); },
    setP: (p) => { if (!pinned) go(Math.min(N - 1, Math.floor(p * N))); },
  });
</script>
</body>
</html>
