<!doctype html>
<html lang="fr" data-palette="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Révélations de texte</title>
<link rel="stylesheet" href="../shared/bank.css">
<style>
  main { max-width: 1240px; margin: 0 auto; padding: 8vh 40px 30vh; display: grid; gap: 14vh; }
  section { display: grid; grid-template-columns: 160px 1fr; gap: 32px; align-items: baseline; }
  section > span { color: var(--muted); font-size: 14px; }
  h2 { font-size: clamp(36px, 5vw, 76px); line-height: 1.04; margin: 0; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
  .w > i { display: inline-block; font-style: normal; will-change: transform; }
  .c { display: inline-block; white-space: pre; }
  mark { color: inherit; background: linear-gradient(var(--tile), var(--tile)) no-repeat 0 85% / 0% 40%; }
  html[data-palette="paper"] mark { background-image: linear-gradient(color-mix(in srgb, var(--tile) 35%, transparent), color-mix(in srgb, var(--tile) 35%, transparent)); }
  .scr { font-family: var(--mono); font-weight: 500; letter-spacing: -.02em; }
  html.embed main { padding: 6vh 6vw; gap: 7vh; } html.embed section > span { display: none; } html.embed section { grid-template-columns: 1fr; }
  @media (max-width: 760px) { section { grid-template-columns: 1fr; gap: 8px; } }
</style>
</head>
<body>
<main>
  <section><span>Masque, mot par mot</span><h2 data-fx="mask">Le texte monte depuis sa ligne.</h2></section>
  <section><span>Lettres floues</span><h2 data-fx="blur">Chaque lettre sort du flou.</h2></section>
  <section><span>Brouillage</span><h2 data-fx="scramble" class="scr">Décodage en cours.</h2></section>
  <section><span>Surlignage</span><h2 data-fx="mark">Un mot <mark>souligné</mark> au bon moment.</h2></section>
</main>
<script src="../shared/bank.js"></script>
<script>
  const rows = [...document.querySelectorAll("h2")].map((h) => {
    const fx = h.dataset.fx, txt = h.textContent;
    h.setAttribute("aria-label", txt);
    if (fx === "mask") h.innerHTML = txt.split(" ").map((w) => `<span class="w" aria-hidden="true"><i>${w}</i></span>`).join(" ");
    if (fx === "blur" || fx === "scramble") h.innerHTML = [...txt].map((c) => `<span class="c" aria-hidden="true">${c}</span>`).join("");
    return { h, fx, txt, parts: [...h.querySelectorAll(fx === "mask" ? ".w > i" : ".c")], mark: h.querySelector("mark") };
  });
  const GLYPHS = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*";
  function render(r, p) {
    const n = r.parts.length;
    if (r.fx === "mask") r.parts.forEach((el, i) => { const t = Bank.easeOut(Bank.seg(p, i / n * .6, i / n * .6 + .4)); el.style.transform = `translateY(${(1 - t) * 110}%)`; });
    if (r.fx === "blur") r.parts.forEach((el, i) => { const t = Bank.seg(p, i / n * .7, i / n * .7 + .3); el.style.opacity = t; el.style.filter = `blur(${(1 - t) * 12}px)`; });
    if (r.fx === "scramble") { const k = Math.floor(p * n * 1.15);
      r.parts.forEach((el, i) => { const ch = r.txt[i]; el.textContent = i < k || ch === " " ? ch : p > 0 && i < k + 6 ? GLYPHS[(Math.random() * GLYPHS.length) | 0] : " "; }); }
    if (r.fx === "mark") { r.h.style.opacity = Bank.seg(p, 0, .3); r.mark.style.backgroundSize = `${Bank.easeOut(Bank.seg(p, .35, .8)) * 100}% 40%`; }
  }
  var cfg = Bank.panel({
    title: "Révélations de texte", values: { palette: "paper", mode: "scroll" },
    selects: [{ key: "mode", label: "Animation", value: "scroll", options: [["scroll", "Au scroll"], ["loop", "Boucle"], ["once", "Une fois"]] }],
    sliders: [{ key: "dur", label: "Durée (s)", min: .6, max: 4, step: .1, value: 1.6 }],
  });
  let gp = 0;
  Bank.drive({ el: document.querySelector("main"), mode: () => cfg.mode, dur: () => cfg.dur * 1000 + 1200, hold: 1400, scroll: () => 1, setP: (p) => (gp = p) });
  (function frame() {
    rows.forEach((r, i) => {
      let p;
      if (Bank.reduced()) p = 1;
      else if (cfg.mode === "scroll") { const b = r.h.getBoundingClientRect(); p = Bank.clamp01((innerHeight * .9 - b.top) / (innerHeight * .45)); }
      else p = Bank.seg(gp, i * .12, i * .12 + .6);
      if (p !== r.last || r.fx === "scramble" && p < 1) { r.last = p; render(r, p); }
    });
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
